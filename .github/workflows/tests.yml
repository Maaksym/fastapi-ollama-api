name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_ai_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_ai_test
      OLLAMA_URL: http://localhost:11434/api/generate
      OLLAMA_MODEL: qwen2.5:3b

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
# Запускаємо всі тести, крім E2E.
# E2E потребує реального Ollama, якого немає в GitHub Actions.
      - name: Run tests
        run: python -m pytest --ignore=tests/test_agent_e2e.py


  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/maaksym/fastapi-ollama-api:latest